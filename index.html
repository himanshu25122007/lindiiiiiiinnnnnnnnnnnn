<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI LinkedIn Analyzer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0f7fa, #80deea); /* Light blue gradient */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Glassmorphism styling */
        .glass-container {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
            padding: 40px;
            width: 85%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        h1 {
            text-align: center;
            color: #005662;
            margin-top: 0;
        }
        p.subtitle {
            text-align: center;
            color: #00796b;
            margin-top: -10px;
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 160px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255, 0.8);
            padding: 15px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.65);
            resize: vertical;
            box-sizing: border-box;
            color: #333;
            font-family: inherit;
        }
        textarea:focus {
            outline: none;
            border: 2px solid #00acc1;
            background: rgba(255, 255, 255, 0.9);
        }
        button {
            background: #0097a7;
            color: white;
            border: none;
            padding: 16px 20px;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 151, 167, 0.3);
        }
        button:hover {
            background: #00838f;
            box-shadow: 0 6px 20px rgba(0, 131, 143, 0.5);
            transform: translateY(-2px);
        }
        #results {
            background: rgba(255, 255, 255, 0.7);
            padding: 25px;
            border-radius: 12px;
            display: none;
            color: #2c3e50;
            line-height: 1.6;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        /* AI output formatting */
        #results h3 { color: #006064; border-bottom: 2px solid #b2ebf2; padding-bottom: 5px; }
        #results ul { padding-left: 20px; }
        #results li { margin-bottom: 8px; }
        
        .loader {
            text-align: center;
            display: none;
            color: #00838f;
            font-weight: bold;
            font-size: 1.1em;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="glass-container">
        <h1>LinkedIn Profile Analyzer</h1>
        <p class="subtitle">Powered by Google Gemini 2.5 AI</p>
        
        <textarea id="profileData" placeholder="Copy and paste the text from a LinkedIn profile here (Experience, About section, Skills, etc.)..."></textarea>
        
        <button onclick="analyzeProfile()">Analyze Profile</button>
        
        <div class="loader" id="loader">🧠 AI is analyzing the profile... Please wait.</div>
        
        <div id="results"></div>
    </div>

  <script>
    // Make sure your input field has id="urlInput" and your result div has id="result"
    async function analyzeProfile() {
        // 1. Grab the exact text from the input field
        const urlInput = document.getElementById('urlInput').value.trim();
        const resultDiv = document.getElementById('result');
        const analyzeBtn = document.querySelector('button'); // Grabs your button

        if (!urlInput) {
            resultDiv.innerHTML = '<span style="color:red;">Error: Please enter a URL first.</span>';
            return;
        }

        // 2. Loading state
        analyzeBtn.innerText = "Analyzing...";
        analyzeBtn.disabled = true;
        resultDiv.innerHTML = "Consulting the AI... This takes a few seconds.";

        try {
            // 3. Send the exact JSON structure the Flask backend is waiting for
            const response = await fetch('/analyze', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({ profileUrl: urlInput }) // Exact key match
            });

            const data = await response.json();

            if (response.ok) {
                // 4. Display the awesome structured results!
                resultDiv.innerHTML = data.analysis; 
            } else {
                resultDiv.innerHTML = `<span style="color:red;">Error: ${data.error}</span>`;
            }
        } catch (error) {
            resultDiv.innerHTML = `<span style="color:red;">Network Error: ${error.message}</span>`;
        } finally {
            analyzeBtn.innerText = "Analyze Profile";
            analyzeBtn.disabled = false;
        }
    }
</script>
</body>
</html>
